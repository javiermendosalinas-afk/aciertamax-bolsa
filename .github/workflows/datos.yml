name: Actualizar bolsa

# Toma cada dia el inventario de la bolsa NeoJaus que genera acierta-pro-web y lo publica.
on:
  schedule:
    - cron: '0 13 * * *'     # 07:00 hora de Guadalajara
  push:
    paths:
      - 'herramientas/disparar.txt'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python herramientas/traer_bolsa.py
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "bolsa-bot"
          git config user.email "bolsa-bot@users.noreply.github.com"
          git add data.json inventario-meta.json
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "Bolsa: inventario $(date -u +%F)"
            git pull --rebase -q || true
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
