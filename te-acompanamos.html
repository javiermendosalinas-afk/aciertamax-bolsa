 const enviar=()=>{const v=$('inp').value.trim();const e=alEnviar(v);if(typeof e==='string'){$('err').textContent=e;return;}};

// ---------- cálculos ----------
const grupo={casa:'c',departamento:'d',terreno:'t'};
function coinciden(tope){if(!DATA)return[];const g=grupo[S.tipo],o=S.operacion==='renta'?'R':'V';
 return DATA.filter(p=>p.o===o&&p.g===g&&(!S.municipio||S.municipio==='cualquiera'||p.m===S.municipio)&&p.p<=tope&&(g==='t'||!S.recamaras||p.r>=S.recamaras));}
const mediana=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:0};
function precalificar(){const ing=num(S.ingresos)+num(S.ingreso_extra),eng=num(S.enganche),r=TASA/12,MESES=(S.plazo||20)*12;let mens=0,credito=0,alcance=0;
 if(S.operacion==='renta'){alcance=ing/3;return{mensualidad:0,credito:0,alcance};}
 if(S.credito==='contado'){alcance=eng/(1+GASTOS);}
 else{mens=ing*.30;if(S.credito==='infonavit'&&num(S.precalif_infonavit))credito=num(S.precalif_infonavit);
  else if(S.credito==='cofinavit'&&num(S.precalif_infonavit))credito=num(S.precalif_infonavit)+mens*(1-Math.pow(1+r,-MESES))/r*.8;
  else credito=mens*(1-Math.pow(1+r,-MESES))/r;
  alcance=(credito+eng)/(1+GASTOS);if(S.credito==='banco'||S.credito==='nose')alcance=Math.min(alcance,eng/(.10+GASTOS));}
 return{mensualidad:Math.round(mens),credito:Math.round(credito),alcance:Math.round(alcance)};}

// ---------- utilidades de asesor ----------
const km=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));};

 document.body.appendChild(q);document.body.style.overflow='hidden';const cerrar=()=>{q.remove();document.body.style.overflow='';};

// ---------- calificación personal (según sus prioridades) ----------
const CRIT={precio:'Precio',ubicacion:'Ubicación y traslados',espacio:'Espacio',seguridad:'Seguridad',amenidades:'Amenidades',lista:'Lista para habitar'};

function relativas(L){const pri=(S.prioridades||[]).concat(Object.keys(CRIT));return L.map(p=>{for(const k of pri){const otros=L.filter(x=>x!==p).map(x=>x.cal.s[k]);if(otros.length&&p.cal.s[k]>Math.max(...otros)+.04)return MEJOR[k];}const m2=x=>(x.s||x.t)?x.p/(x.s||x.t):1e12,om=L.filter(x=>x!==p).map(m2);if(om.length&&m2(p)<Math.min(...om)*.95)return 'la de mejor precio por m²';
 const tr=x=>x.t||0,ot=L.filter(x=>x!==p).map(tr);if(ot.length&&tr(p)>Math.max(...ot)*1.15)return 'la de más terreno';
 return 'muy parecida a las otras en lo que más te importa';});}
let DET={};
async function detalles(lista){const arch=[...new Set(lista.filter(p=>p.e.startsWith('NJ-')).map(p=>p.e.slice(-2).toLowerCase().replace(/[^a-z0-9]/g,'0')))].filter(a=>!(a in DET));

function calificar(p,ctx){const d=det(p),tope=ctx.tope,am=(d.amenidades||[]).join(' ').toLowerCase(),tx=(p.x+' '+(d.descripcion||'')).toLowerCase();
