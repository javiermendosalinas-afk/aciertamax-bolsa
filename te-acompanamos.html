<script>
(function(){
'use strict';
const AV={S:'/assets/avatares/sofia.svg',SC:'/assets/avatares/sofia-celebra.svg',SS:'/assets/avatares/sofia-senala.svg',D:'/assets/avatares/diego.svg',DL:'/assets/avatares/diego-lupa.svg',DP:'/assets/avatares/diego-pensando.svg'};
const MUNI=['Zapopan','Guadalajara','Tlaquepaque','Tonalá','Tlajomulco de Zúñiga'];
const TASA=.1013, MESES=240, GASTOS=.06;
const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let S=JSON.parse(localStorage.getItem('ipro_acomp')||'null')||{favoritas:[],imprescindibles:[]};
const URLQ=new URLSearchParams(location.search),FAV=(URLQ.get('fav')||'').toUpperCase().replace(/[^A-Z0-9-]/g,''),PREOP=['compra','renta'].includes(URLQ.get('op'))?URLQ.get('op'):'';
let CFG={endpoint:'https://aciertamax-webhook.onrender.com/api/camino',avisoVersion:''}, DATA=null, paso=0, sondeo=null;

fetch('/camino-datos.json').then(r=>r.json()).then(j=>{CFG=Object.assign(CFG,j)}).catch(()=>{});
const cargarDatos=()=>DATA?Promise.resolve(DATA):fetch('/presupuesto/buscador.json').then(r=>r.json()).then(j=>DATA=j).catch(()=>DATA=[]);
cargarDatos();

// ---------- piezas de conversación ----------
function decir(quien,html,pose){const d=document.createElement('div');const diego=quien==='Diego';d.className='msg'+(diego?' diego':'');
 d.innerHTML=`<img class="av" src="${AV[pose||(diego?'D':'S')]}" alt="${quien}" width="64" height="70"><div class="b"><span class="quien">${quien}</span>${html}</div>`;$('chat').appendChild(d);}

 r.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{yo(b.textContent.trim());r.innerHTML='';alElegir(b.dataset.v);});bajar();}
function campo(tipo,ph,alEnviar,{valor='',saltar=false,boton='Listo',modo='',saltarTxt='Prefiero no decir'}={}){const r=$('resp');r.className='resp';
 r.innerHTML=`<input type="${tipo}" id="inp" placeholder="${esc(ph)}" value="${esc(valor)}" ${modo?`inputmode="${modo}"`:''} autocomplete="on"><button type="button" class="prim" id="ok">${boton}</button>${saltar?`<button type="button" class="sec" id="skip">${saltarTxt}</button>`:''}<div class="error" id="err"></div>`;
 const enviar=()=>{const v=$('inp').value.trim();const e=alEnviar(v);if(typeof e==='string'){$('err').textContent=e;return;}};
 $('ok').onclick=enviar;$('inp').onkeydown=e=>{if(e.key==='Enter')enviar();};if(saltar)$('skip').onclick=()=>{yo(saltarTxt);r.innerHTML='';alEnviar(null);};
 setTimeout(()=>$('inp')&&$('inp').focus(),50);bajar();}
function progreso(p,txt){$('riel').style.width=Math.min(100,p)+'%';$('rielTxt').textContent=txt;}

// ---------- cálculos ----------
const grupo={casa:'c',departamento:'d',terreno:'t'};
function coinciden(tope){if(!DATA)return[];const g=grupo[S.tipo],o=S.operacion==='renta'?'R':'V';
 return DATA.filter(p=>p.o===o&&p.g===g&&(!S.municipio||S.municipio==='cualquiera'||p.m===S.municipio)&&p.p<=tope&&(g==='t'||!S.recamaras||p.r>=S.recamaras));}
const mediana=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:0};
function precalificar(){const ing=num(S.ingresos),eng=num(S.enganche),r=TASA/12;let mens=0,credito=0,alcance=0;
 if(S.operacion==='renta'){alcance=ing/3;return{mensualidad:0,credito:0,alcance};}
 if(S.credito==='contado'){alcance=eng/(1+GASTOS);}
 else{mens=ing*.30;if(S.credito==='infonavit'&&num(S.precalif_infonavit))credito=num(S.precalif_infonavit);
  else if(S.credito==='cofinavit'&&num(S.precalif_infonavit))credito=num(S.precalif_infonavit)+mens*(1-Math.pow(1+r,-MESES))/r*.8;
  else credito=mens*(1-Math.pow(1+r,-MESES))/r;
  alcance=(credito+eng)/(1+GASTOS);if(S.credito==='banco'||S.credito==='nose')alcance=Math.min(alcance,eng/(.10+GASTOS));}
 return{mensualidad:Math.round(mens),credito:Math.round(credito),alcance:Math.round(alcance)};}

// ---------- el recorrido ----------
const PASOS=[
 ()=>{progreso(3,'Nos conocemos');if(FAV&&!S.favoritas.includes(FAV)){S.favoritas.push(FAV);guardar();}if(PREOP)S.operacion=PREOP;
  if(FAV)decir('Sofía','¡Qué onda! Soy <strong>Sofía</strong> y él es Diego. Vi que te gustó una propiedad: ya la apunté en tus favoritas ♥. Con unas preguntas rápidas te dejamos listo con un asesor para que la veas, y de paso te enseñamos otras que te pueden gustar. ¿Cómo te llamas?','SC');else decir('Sofía','¡Qué onda! Soy <strong>Sofía</strong> y él es Diego. Te vamos a ayudar a encontrar tu lugar y a dejarte listo con un asesor de verdad, sin vueltas. Son unas preguntas rápidas. ¿Cómo te llamas?','S');
  campo('text','Tu nombre',v=>{if(v.length<2)return'Escribe tu nombre para seguir.';S.nombre=v;yo(v);sig();},{valor:S.nombre||''});},
 ()=>{progreso(8,'Qué buscas');if(PREOP){decir('Diego',`¡Mucho gusto, ${esc(S.nombre.split(' ')[0])}! Vamos a afinar lo que buscas.`,'D');return sig(true);}decir('Diego',`¡Mucho gusto, ${esc(S.nombre.split(' ')[0])}! Para empezar: ¿quieres <strong>comprar</strong> o <strong>rentar</strong>?`,'D');
  opciones([['compra','🔑 Comprar'],['renta','📝 Rentar']],v=>{S.operacion=v;sig();});},
 ()=>{progreso(13,'Qué buscas');decir('Sofía','¿Qué tipo de lugar tienes en mente?','S');
  opciones([['casa','🏡 Casa'],['departamento','🏢 Depa'],['terreno','🌳 Terreno']],v=>{S.tipo=v;sig();});},
 ()=>{if(S.operacion==='renta'||S.tipo==='terreno'){S.uso=S.tipo==='terreno'?'invertir':'vivir';return sig(true);}
  decir('Sofía','¿Es para vivir o para invertir?','S');opciones([['vivir','🏠 Para vivir'],['invertir','📈 Para invertir']],v=>{S.uso=v;sig();});},
 ()=>{if(S.uso!=='vivir')return sig(true);progreso(20,'Para quién');decir('Diego','¿Quiénes van a vivir ahí? Así sé cuánto espacio buscar.','D');
  opciones([['solo','🙋 Yo solo(a)'],['pareja','💑 En pareja'],['familia','👨‍👩‍👧 Familia con hijos'],['roomies','👯 Con roomies']],v=>{S.para_quien=v;sig();});},
 ()=>{progreso(26,'La zona');decir('Diego','¿Por dónde te late? Cada municipio tiene lo suyo: Zapopan tiene más oferta, en Tlajomulco rinde más el m² y Guadalajara te deja cerca de todo.','D');
  opciones([...MUNI.map(m=>[m,m.replace(' de Zúñiga','')]),['cualquiera','📍 Me da igual']],v=>{S.municipio=v;sig();});},
 ()=>{if(S.municipio==='cualquiera')return sig(true);decir('Diego','¿Alguna colonia o referencia en especial? (cerca de tu trabajo, de la escuela de los niños…)','D');
  campo('text','Colonia o referencia',v=>{if(v===null||!v){S.colonia='';if(v!==null)yo('Ninguna en especial');}else{S.colonia=v;yo(v);}sig();},{saltar:true,boton:'Seguir',saltarTxt:'Ninguna en especial'});},
 ()=>{if(S.tipo==='terreno')return sig(true);progreso(32,'El espacio');decir('Sofía','¿Cuántas recámaras necesitas como mínimo?','S');
  opciones([['1','1'],['2','2'],['3','3'],['4','4 o más']],v=>{S.recamaras=+v;sig();});},
 ()=>{progreso(38,'Lo indispensable');decir('Diego','¿Qué no puede faltar? Marca todo lo que aplique.','D');
  const ops=S.tipo==='terreno'?['Servicios hasta el lote','Uso de suelo habitacional','Dentro de coto','Escrituras listas']:['Jardín o patio','2 o más estacionamientos','Una sola planta','Coto con seguridad','Acepta mascotas','Amenidades (alberca, gym)','Cerca de escuelas','Cerca de mi trabajo'];
  const r=$('resp');r.className='resp';r.innerHTML=ops.map(o=>`<button type="button" class="${S.imprescindibles.includes(o)?'sel':''}" data-o="${esc(o)}">${esc(o)}</button>`).join('')+'<button type="button" class="prim" id="ok">Listo</button>';
  r.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{b.classList.toggle('sel');});
  $('ok').onclick=()=>{S.imprescindibles=[...r.querySelectorAll('[data-o].sel')].map(b=>b.dataset.o);yo(S.imprescindibles.length?S.imprescindibles.join(', '):'Nada en especial');r.innerHTML='';sig();};bajar();},
 ()=>{progreso(45,'Tu presupuesto');const renta=S.operacion==='renta';const R=renta?[4000,80000,1000,15000]:S.tipo==='terreno'?[300000,10000000,100000,2000000]:[800000,15000000,100000,3500000];
  if(!S.presupuesto)S.presupuesto=R[3];decir('Sofía',renta?'¿Cuánto quieres pagar de renta al mes, como máximo?':'¿Hasta cuánto tienes pensado invertir? Mueve la barra; te voy diciendo cuántas opciones hay.','S');
  const r=$('resp');r.className='resp';r.innerHTML=`<input type="range" id="rg" min="${R[0]}" max="${R[1]}" step="${R[2]}" value="${S.presupuesto}" aria-label="Presupuesto"><span class="monto" id="mt"></span><div style="flex-basis:100%;color:#5b6575;font-size:.9rem" id="cuantas"></div><button type="button" class="prim" id="ok">Ese es mi presupuesto</button>`;
  const pintar=()=>{S.presupuesto=+$('rg').value;$('mt').textContent=din(S.presupuesto)+(renta?'/mes':'');cargarDatos().then(()=>{const l=coinciden(S.presupuesto);$('cuantas').textContent=l.length?`Hay ${l.length} opciones que encajan con lo que me has dicho.`:'Con esto aún no encuentro opciones; súbele tantito.';});};
  $('rg').oninput=pintar;pintar();$('ok').onclick=()=>{yo(din(S.presupuesto)+(renta?' al mes':''));r.innerHTML='';
   cargarDatos().then(()=>{const l=coinciden(S.presupuesto);const m=mediana(l.map(p=>p.p));
    if(l.length){dato(`<b>${l.length} opciones</b><span>${S.tipo==='casa'?'casas':S.tipo==='departamento'?'depas':'terrenos'} en ${esc(S.municipio==='cualquiera'?'la zona metropolitana':S.municipio)} de hasta ${din(S.presupuesto)}${renta?'/mes':''}. La mitad cuesta menos de ${din(m)}.</span>`);}
    else decir('Diego','Mmm… con ese presupuesto y esas características todavía no encuentro opciones. No pasa nada: tu asesor busca también fuera de nuestro inventario. Sigamos.','DP');sig();});};bajar();},
 ()=>{if(S.operacion==='renta')return sig(true);progreso(52,'Cómo pagarías');decir('Sofía','Ahora lo importante para que nadie te haga perder el tiempo: ¿cómo lo pagarías?','S');
  opciones([['banco','🏦 Crédito bancario'],['infonavit','🟥 Infonavit'],['cofinavit','🤝 Cofinavit'],['fovissste','🟩 Fovissste'],['contado','💵 De contado'],['nose','🤔 Aún no sé']],v=>{S.credito=v;sig();});},
 ()=>{if(S.operacion!=='renta'&&S.credito==='contado')return sig(true);progreso(58,'Tus ingresos');
  decir('Sofía',S.operacion==='renta'?'Para rentar, el dueño suele pedir ingresos de unas 3 veces la renta. ¿Cuánto ganan al mes en tu hogar, aproximadamente?':'Para calcular cuánto te prestan necesito una idea de tus ingresos: ¿cuánto ganan al mes en tu hogar, sumando lo que se pueda comprobar? Es solo para la estimación; no se comparte con nadie fuera de Acierta Max.','S');
  campo('text','Ej. 45,000',v=>{if(v===null){S.ingresos=0;return sig();}const n=num(v);if(n<3000)return'Escribe el ingreso mensual aproximado, en pesos.';S.ingresos=n;yo(din(n)+' al mes');sig();},{saltar:true,modo:'numeric',valor:S.ingresos?String(S.ingresos):''});},
 ()=>{if(!num(S.ingresos)||S.operacion==='renta'&&!num(S.ingresos))return sig(true);decir('Diego','¿Y esos ingresos son de…?','D');
  opciones([['nomina','💼 Nómina'],['independiente','🧾 Honorarios / independiente'],['negocio','🏪 Negocio propio'],['pensionado','🏖️ Pensión']],v=>{S.empleo=v;sig();});},
 ()=>{if(!(S.credito==='infonavit'||S.credito==='cofinavit'))return sig(true);progreso(64,'Infonavit');
  decir('Sofía','¿Ya sabes de cuánto es tu precalificación de Infonavit? Viene en <em>Mi Cuenta Infonavit</em>. Si no la tienes a la mano, no pasa nada.','S');
  campo('text','Monto de tu precalificación',v=>{if(v===null){S.precalif_infonavit=0;return sig();}const n=num(v);if(n<50000)return'Escribe el monto en pesos, o elige "Prefiero no decir".';S.precalif_infonavit=n;yo(din(n));sig();},{saltar:true,modo:'numeric'});},
 ()=>{if(S.operacion==='renta')return sig(true);progreso(70,'Tu enganche');
  decir('Sofía',S.credito==='contado'?'¿Cuánto tienes disponible para la compra, incluyendo los gastos de escrituración?':'¿Cuánto tienes ahorrado para enganche y gastos de escrituración? Los gastos suelen ser de 5% a 8% del precio.','S');
  campo('text','Ej. 400,000',v=>{if(v===null){S.enganche=0;return sig();}S.enganche=num(v);yo(din(S.enganche));sig();},{saltar:true,modo:'numeric',valor:S.enganche?String(S.enganche):''});},
 ()=>{progreso(76,'Lo que te alcanza');S.precalif=precalificar();const P=S.precalif,pres=S.presupuesto;
  if(S.operacion==='renta'){if(!num(S.ingresos))return sig(true);const ok=P.alcance>=pres;S.precalif.veredicto=ok?'sus ingresos cubren la renta':'renta alta para sus ingresos';
   decir('Sofía',ok?`¡Va! Con ${din(S.ingresos)} de ingresos, una renta de hasta <strong>${din(P.alcance)}</strong> es sana. Tu presupuesto cabe.`:`Con ${din(S.ingresos)} de ingresos, lo sano es una renta de hasta <strong>${din(P.alcance)}</strong>. Tu presupuesto está un poco arriba; un aval o ingresos de alguien más ayudan.`,ok?'SC':'S');return sig(true);}
  const sinDatos=S.credito!=='contado'&&!num(S.ingresos)&&!num(S.precalif_infonavit);

  const r=P.alcance/pres;const v=r>=1?'cabe':r>=.85?'justo':'no alcanza';S.precalif.veredicto=v==='cabe'?'su presupuesto cabe':v==='justo'?'presupuesto justo':'presupuesto arriba de su capacidad';

async function post(ruta,datos){try{const r=await fetch(CFG.endpoint+ruta,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)});const j=await r.json().catch(()=>({}));return{ok:r.ok&&j.ok!==false,j};}catch(e){return{ok:false,j:{error:'No pudimos conectar. Revisa tu internet.'}};}}
async function registrar(){if(S.folio&&S.token){return sig();}
 const res=await post('',{nombre:S.nombre,whatsapp:S.whatsapp,email:S.email||'',consentimiento:true,aviso_version:CFG.avisoVersion,operacion:S.operacion,tipo:S.tipo,uso:S.uso||'',cuando:S.cuando||'',municipio:S.municipio||'cualquiera',colonia:S.colonia||'',empresa:$('empresa').value});
 if(res.ok&&res.j.folio){S.folio=res.j.folio;S.token=res.j.token;S.vendedor=res.j.vendedor||'';guardar();$('resp').innerHTML='';sig();}
 else{const e=$('err');if(e)e.textContent=(res.j&&res.j.error)||'No pudimos guardar tus datos. Escríbenos por WhatsApp al 33 3377 7337.';const b=$('ver');if(b){b.disabled=false;b.textContent='Confirmar mi WhatsApp';}}}

if(S.terminado){S={favoritas:[],imprescindibles:[]};}
